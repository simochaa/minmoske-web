<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">

  <title>Min moské</title>
  <meta name="description" content="Min moské: intranett og koranskole for moskeer i Norge.">
  <style>
    :root { --deep: #0B3A2D; --gold: #D4AF5A; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--deep); color: #fff; padding: 24px 16px;
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }
    svg { width: 96px; height: 96px; }
    h1 { margin: 16px 0 6px; font-size: 30px; }
    p { margin: 0 0 24px; color: #BFD8D5; max-width: 420px; }
    a {
      display: inline-block; padding: 12px 20px; border-radius: 12px;
      background: var(--gold); color: var(--deep); font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" rx="22" fill="#0B3A2D"/>
      <rect x="27" y="27" width="46" height="46" fill="#D4AF5A"/>
      <rect x="27" y="27" width="46" height="46" fill="#D4AF5A" transform="rotate(45 50 50)"/>
      <circle cx="50" cy="50" r="13" fill="#134D3C"/>
      <path d="M55.5 43 a8.5 8.5 0 1 0 0 14 a9 9 0 0 1 0 -14 Z" fill="#D4AF5A"/>
    </svg>
    <h1>Min moské</h1>
    <p>Nyheter, kalender, bønnetider og koranskole for moskeen din, samlet i én app.</p>
    <a href="personvern.html">Personvernerklæring</a>

</html>
